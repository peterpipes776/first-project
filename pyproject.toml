[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sweepdesk"
version = "0.1.0"
description = "Find, vet and keep track of free UK prize draws worth entering"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sweepdesk = "sweepdesk.cli:main"

[tool.setuptools]
packages = ["sweepdesk"]
